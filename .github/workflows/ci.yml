name: CI — Build & Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ────────────────────────────────────────────────
  # Job 1: Build the ASP.NET Core 8 API
  # ────────────────────────────────────────────────
  build-api:
    name: Build .NET API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: dotnet restore "final final api/ChineseAuction.Api/ChineseAuction.Api.csproj"

      - name: Build (Release)
        run: dotnet build "final final api/ChineseAuction.Api/ChineseAuction.Api.csproj" --no-restore -c Release

  # ────────────────────────────────────────────────
  # Job 2: Build the Angular 20 frontend
  # ────────────────────────────────────────────────
  build-frontend:
    name: Build Angular Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: chinese-auction-web/package-lock.json

      - name: Install npm dependencies
        run: npm ci
        working-directory: chinese-auction-web

      - name: Build Angular app
        run: npm run build -- --configuration production
        working-directory: chinese-auction-web

  # ────────────────────────────────────────────────
  # Job 3: Build the Docker image (requires job 1)
  # ────────────────────────────────────────────────
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t chinese-auction-api:${{ github.sha }} -f Dockerfile .

      - name: Verify container starts
        run: |
          docker run --rm -d \
            --name test-container \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -p 8080:8080 \
            chinese-auction-api:${{ github.sha }}
          sleep 5
          docker stop test-container
